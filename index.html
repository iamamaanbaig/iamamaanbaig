<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Amaan Baig — User Experience Designer</title>
  <meta name="description" content="Amaan Baig, User Experience Designer. Making complicated software feel obvious. AI for speed, experience for judgment.">
  <meta name="theme-color" content="#000000">
  <meta property="og:title" content="Amaan Baig — User Experience Designer">
  <meta property="og:description" content="Making complicated software feel obvious.">
  <meta property="og:image" content="assets/amaan.jpg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500&family=Playfair+Display:ital@0;1&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #000;
      --text: #F4F4F0;
      --muted: #8B8B85;
      --green: #A6F36A;
      --blue: #0A66C2;
      --blue-hover: #1A7ADB;

      --sans: "Plus Jakarta Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif: "Playfair Display", Georgia, "Times New Roman", serif;

      --gutter: 5.5vw;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; min-height: 100svh;
      display: flex; flex-direction: column;
      background: var(--bg); color: var(--text);
      font-family: var(--sans); font-size: 16px; line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    ::selection { background: var(--green); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--green); outline-offset: 3px; border-radius: 4px; }

    /* ---------- Header ---------- */
    .nav {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: clamp(20px, 4.1vw, 64px) var(--gutter) 0;
    }
    .brand { font-weight: 500; font-size: clamp(16px, 2.1vw, 42px); letter-spacing: .01em; white-space: nowrap; }
    .social { display: flex; align-items: center; gap: .45em; font-size: clamp(14px, 2.1vw, 42px); }
    .pill {
      display: inline-flex; align-items: center;
      background: var(--blue); color: #fff;
      padding: .2em .8em; border-radius: 999px;
      transition: background .2s, transform .2s var(--ease);
    }
    .pill:hover { background: var(--blue-hover); transform: translateY(-1px); }
    .handle { transition: color .2s; }
    .handle:hover { color: var(--green); }

    /* ---------- Hero ---------- */
    .hero { flex: 1; padding: clamp(40px, 9.4vw, 150px) var(--gutter) 0; }
    .intro {
      margin: 0; max-width: 62vw;
      font-size: clamp(18px, 2.3vw, 46px); line-height: 1.25; font-weight: 400;
    }
    .intro em { font-style: normal; color: var(--green); }

    .display { margin: 0; font-family: var(--serif); font-weight: 400; line-height: 1; }
    /* Row 1: "AI for speed ——" with the carousel to the right */
    .speed {
      position: relative; display: flex; align-items: center;
      margin-top: 2.4vw;
      font-style: italic; font-size: 9.05vw; letter-spacing: -.01em;
    }
    .dash { flex: none; width: 12.5vw; height: max(3px, .42vw); margin: .1em 0 0 3.6vw; background: var(--text); }

    /* Row 2: photo pill + "Experience for judgment" */
    .judgment { display: flex; align-items: center; gap: 3.5vw; margin-top: 1.6vw; }
    .photo {
      flex: none; width: 30.5vw; aspect-ratio: 604 / 406;
      border-radius: 999px; overflow: hidden; background: #1a1a1a;
    }
    .photo img { width: 100%; height: 100%; object-fit: cover; }
    .judgment .display { font-size: 8.9vw; line-height: 1.3; }

    /* ---------- Carousel around the glass spark ---------- */
    /* 8 curved cards repeat 4 images (1 2 3 4 1 2 3 4). Swap the files in assets/cards/ to change them. */
    .orbit {
      --img-1: url('assets/cards/claude.svg'); --img-2: url('assets/cards/chatgpt.svg');
      --img-3: url('assets/cards/notebooklm.svg'); --img-4: url('assets/cards/figma.svg');
      --fill-1: #D97757; --fill-2: #10A37F; --fill-3: #000; --fill-4: #fff;
      position: absolute; left: 54vw; top: 50%; z-index: 2;
      width: 40vw; aspect-ratio: 1; transform: translateY(-52%);
      display: grid; place-items: center;
      perspective: 1400px; transform-style: preserve-3d;
      pointer-events: none;
    }
    .orbit > * { grid-area: 1 / 1; }
    /* .tilt holds the ring's angle and a gentle float; .ring spins at a constant speed */
    .tilt, .ring { display: block; position: relative; width: var(--card, 60px); height: var(--card, 60px); transform-style: preserve-3d; }
    .tilt { transform: rotateZ(-35deg) rotateX(-28deg); animation: sway 3.5s ease-in-out infinite alternate; }
    .ring { transform: rotateY(22.5deg); animation: spin 24s linear infinite; }
    @keyframes sway {
      from { transform: translateY(.3vw) rotateZ(-36deg) rotateX(-28deg); }
      to   { transform: translateY(-.3vw) rotateZ(-34deg) rotateX(-28deg); }
    }
    @keyframes spin { from { transform: rotateY(22.5deg); } to { transform: rotateY(-337.5deg); } }
    .tile, .slice { position: absolute; transform-style: preserve-3d; }
    .tile { inset: 0; }
    /* Each card is built from thin vertical slices so it bends with the ring */
    .slice { top: 0; left: 50%; height: 100%; }
    .slice i {
      position: absolute; inset: 0;
      background:
        linear-gradient(rgba(0, 0, 0, var(--depth, 0)), rgba(0, 0, 0, var(--depth, 0))),
        linear-gradient(rgba(0, 0, 0, var(--shade, 0)), rgba(0, 0, 0, var(--shade, 0))),
        var(--img) var(--bx) 0 / var(--card) 100% no-repeat,
        var(--fill);
      -webkit-mask: var(--corner) var(--bx) 0 / var(--card) 100% no-repeat;
              mask: var(--corner) var(--bx) 0 / var(--card) 100% no-repeat;
      backface-visibility: hidden; -webkit-backface-visibility: hidden;
    }
    /* Inner side of a card: only ever seen on the far side of the ring, so it is always dimmed and blurred */
    .slice i + i { transform: rotateY(180deg); --bx: var(--bx-back); --depth: .6; filter: blur(2px); }

    .spark {
      width: 44%; height: auto; overflow: visible;
      filter: drop-shadow(0 .6vw 1.6vw rgba(120, 230, 70, .4));
      animation: float 5s ease-in-out infinite;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50%      { transform: translateY(-.4vw) rotate(8deg); }
    }

    /* ---------- Clients ---------- */
    .clients {
      display: flex; align-items: center; justify-content: space-between; gap: 2vw;
      margin: 0; padding: 4.5vw var(--gutter) clamp(28px, 6.5vw, 110px); list-style: none;
    }
    .clients img { height: 4.1vw; width: auto; mix-blend-mode: screen; /* black logo backgrounds disappear */ }

    /* Load-in */
    .rise { opacity: 0; transform: translateY(18px); animation: rise .9s var(--ease) forwards; animation-delay: calc(var(--d, 0) * 110ms); }
    @keyframes rise { to { opacity: 1; transform: none; } }

    /* ---------- Phones ---------- */
    @media (max-width: 760px) {
      :root { --gutter: 20px; }
      .social .label, .handle { display: none; }
      .intro { max-width: none; }
      .speed { flex-wrap: wrap; font-size: 15vw; margin-top: 28px; }
      .dash { display: none; }
      .orbit { position: relative; left: auto; top: auto; transform: none; width: 78vw; margin: -2vw auto -4vw; flex-basis: 100%; }
      .judgment { flex-direction: column; align-items: flex-start; gap: 20px; margin-top: 8px; }
      .photo { width: 100%; }
      .judgment .display { font-size: 15vw; }
      .clients { flex-wrap: wrap; justify-content: center; gap: 18px 28px; padding-top: 48px; }
      .clients img { height: 30px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
      .rise { opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <header class="nav">
    <a class="brand" href="./" aria-label="Amaan Baig, home">AMAAN BAIG.</a>
    <nav class="social" aria-label="Contact">
      <span class="label">Get in touch on</span>
      <a class="pill" href="https://www.linkedin.com/in/iamamaanbaig/" target="_blank" rel="noopener">Linkedin</a>
      <a class="handle" href="https://www.linkedin.com/in/iamamaanbaig/" target="_blank" rel="noopener">@iamamaanbaig</a>
    </nav>
  </header>

  <main class="hero">
    <p class="intro rise" style="--d:0">User Experience Designer. <em>Making complicated software feel obvious.</em></p>

    <h1 class="display speed rise" style="--d:1">
      <span>AI for speed</span><span class="dash" aria-hidden="true"></span>
      <span class="orbit" id="orbit" aria-hidden="true">
        <span class="tilt"><span class="ring" id="ring"></span></span> <!-- cards are built by the script below -->
          <svg class="spark" viewBox="0 0 100 100">
            <defs>
              <!-- green liquid inside the glass -->
              <radialGradient id="sparkCore" cx="56%" cy="60%" r="58%">
                <stop offset="0" stop-color="#F2FFDC"/>
                <stop offset=".22" stop-color="#C4FB8C"/>
                <stop offset=".55" stop-color="#6FD83A"/>
                <stop offset="1" stop-color="#1B5E12"/>
              </radialGradient>
              <!-- shade on the lower-right faces for volume -->
              <linearGradient id="sparkShade" x1="20%" y1="20%" x2="85%" y2="90%">
                <stop offset=".45" stop-color="#0B2A06" stop-opacity="0"/>
                <stop offset="1" stop-color="#0B2A06" stop-opacity=".55"/>
              </linearGradient>
              <!-- glass sheen on the upper-left faces -->
              <linearGradient id="sparkSheen" x1="10%" y1="5%" x2="60%" y2="60%">
                <stop offset="0" stop-color="#fff" stop-opacity=".9"/>
                <stop offset=".4" stop-color="#fff" stop-opacity=".22"/>
                <stop offset="1" stop-color="#fff" stop-opacity="0"/>
              </linearGradient>
              <!-- rim light -->
              <linearGradient id="sparkRim" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fff" stop-opacity="1"/>
                <stop offset=".5" stop-color="#E8FFD0" stop-opacity=".25"/>
                <stop offset="1" stop-color="#C8FF96" stop-opacity=".8"/>
              </linearGradient>
              <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0" stop-color="#FAFFF0" stop-opacity=".95"/>
                <stop offset="1" stop-color="#B9FA7C" stop-opacity="0"/>
              </radialGradient>
              <filter id="sparkSoft" x="-30%" y="-30%" width="160%" height="160%">
                <feGaussianBlur stdDeviation="2.2"/>
              </filter>
              <clipPath id="sparkClip"><path d="M50 3C55 33 67 45 97 50 67 55 55 67 50 97 45 67 33 55 3 50 33 45 45 33 50 3Z"/></clipPath>
            </defs>
            <g clip-path="url(#sparkClip)">
              <rect width="100" height="100" fill="url(#sparkCore)"/>
              <rect width="100" height="100" fill="url(#sparkShade)"/>
              <!-- refracted glow in the middle -->
              <circle cx="52" cy="54" r="17" fill="url(#sparkGlow)" filter="url(#sparkSoft)"/>
              <!-- upper-left facets catch the light -->
              <path d="M50 3C55 33 67 45 97 50H50Z M3 50C33 45 45 33 50 3V50Z" fill="url(#sparkSheen)"/>
              <!-- darker inner edge -->
              <path d="M50 3C55 33 67 45 97 50 67 55 55 67 50 97 45 67 33 55 3 50 33 45 45 33 50 3Z" fill="none" stroke="#0E3A08" stroke-opacity=".45" stroke-width="5" filter="url(#sparkSoft)"/>
            </g>
            <path d="M50 3C55 33 67 45 97 50 67 55 55 67 50 97 45 67 33 55 3 50 33 45 45 33 50 3Z" fill="none" stroke="url(#sparkRim)" stroke-width="1.2"/>
            <!-- specular highlights -->
            <path d="M47.5 12C48.5 24 49 31 45 39" stroke="#fff" stroke-width="3" stroke-opacity=".55" stroke-linecap="round" fill="none" opacity=".9" filter="url(#sparkSoft)"/>
            <ellipse cx="46.5" cy="22" rx="1.1" ry="4.5" fill="#fff" opacity=".95" transform="rotate(-6 46.5 22)"/>
            <ellipse cx="24" cy="48.2" rx="9" ry="1.1" fill="#fff" opacity=".55"/>
            <circle cx="62" cy="62" r="1.6" fill="#fff" opacity=".5"/>
          </svg>
      </span>
    </h1>

    <div class="judgment">
      <div class="photo rise" style="--d:2"><img src="assets/amaan.jpg" alt="Amaan Baig in conversation with colleagues" width="604" height="406"></div>
      <p class="display rise" style="--d:3">Experience<br>for judgment</p>
    </div>
  </main>

  <ul class="clients rise" style="--d:4" aria-label="Companies I've worked with">
    <li><img src="assets/logos/lasalle.png" alt="LaSalle Investment Management"></li>
    <li><img src="assets/logos/jll.png" alt="JLL Technologies"></li>
    <li><img src="assets/logos/nokia.png" alt="Nokia"></li>
    <li><img src="assets/logos/globallogic.png" alt="GlobalLogic, a Hitachi Group Company"></li>
    <li><img src="assets/logos/marlabs.png" alt="Marlabs"></li>
  </ul>

  <script>
    (function () {
      /* Carousel: builds 8 curved cards sized to the ring; the spin itself is a CSS animation */
      var orbit = document.getElementById('orbit');
      var ring = document.getElementById('ring');
      var CARDS = 8, SLICES = 8, GAP = 360 / CARDS;
      var CORNER = 'url("data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" preserveAspectRatio="none"><rect width="40" height="40" rx="10"/></svg>') + '")';
      function buildOrbit() {
        var size = orbit.getBoundingClientRect().width;
        var r = size / 2.7;                // ring radius: ring + one card fill the box
        var card = r * 0.7;                // card width and height, measured along the curve
        orbit.style.setProperty('--card', card.toFixed(2) + 'px');
        var arc = card / r;                // card angle in radians
        var d = arc / SLICES;              // slice angle
        var w = 2 * r * Math.sin(d / 2) + 1.2;   // slice width (+ overlap hides seams)
        var html = '';
        for (var c = 0; c < CARDS; c++) {
          var k = c % 4 + 1;
          html += '<span class="tile" style="--img:var(--img-' + k + ');--fill:var(--fill-' + k + ');--corner:' + CORNER.replace(/"/g, '&quot;') + ';transform:rotateY(' + c * GAP + 'deg)">';
          for (var n = 0; n < SLICES; n++) {
            var t = (n - (SLICES - 1) / 2) * d;   // slice offset from the card's centre
            var shade = (0.22 * Math.abs(t) / (arc / 2)).toFixed(3);
            html += '<span class="slice" style="width:' + w.toFixed(2) + 'px;margin-left:' + (-w / 2).toFixed(2) + 'px;' +
              'transform:rotateY(' + (t * 180 / Math.PI).toFixed(3) + 'deg) translateZ(' + r.toFixed(2) + 'px);' +
              '--bx:' + (-n * card / SLICES).toFixed(2) + 'px;--bx-back:' + (-(SLICES - 1 - n) * card / SLICES).toFixed(2) + 'px;--shade:' + shade + '">' +
              '<i></i><i></i></span>';
          }
          html += '</span>';
        }
        ring.innerHTML = html;
      }
      buildOrbit();
      var lastW = window.innerWidth, t;
      window.addEventListener('resize', function () {
        if (window.innerWidth === lastW) return;   // ignore mobile address-bar height changes
        lastW = window.innerWidth;
        clearTimeout(t); t = setTimeout(buildOrbit, 120);
      });
    })();
  </script>
</body>
</html>
